# The @aubwang/dsh-consult bundle patch: one insert contributing the delegation
# capability to a profile.
#
# Two rows, not three. `src/seam.ts` is the Service DEFINITION — an abstract
# class plus vocabulary types — and mounting it would register a ctx.delegation
# with no implementations, so it has no row: the PROVIDER row is the service
# mount, exactly as `@deepseek-ai/dsh-bash-local` mounts `ctx.shell` while
# `@deepseek-ai/dsh-shell` has no row of its own.
#
# A profile's own cordis.patch.yml can override either row by id without
# touching this package; a patch replaces a row's whole `config`, so restate
# every key you need.

- insert:
    # PROVIDER: mounts ctx.delegation over the consult CLI. Requires
    # ctx.subprocess (dsh-base mounts @deepseek-ai/dsh-subprocess-local).
    - id: consult-delegation
      name: '@aubwang/dsh-consult/provider'

    # CONSUMER: the model-facing delegate* tools. Requires ctx.tools and
    # ctx.delegation; picks up ctx.jobs when one is mounted.
    - id: tool-delegate
      name: '@aubwang/dsh-consult/tools'

    # CONSUMER #2: the human-triggered `/review` command. Requires ctx.commands
    # and ctx.delegation. It never triggers itself — automatic review policy
    # belongs in a separate plugin over the same seam.
    - id: reviewer
      name: '@aubwang/dsh-consult/reviewer'

# Swapping the provider is a one-row change, because the consumer talks only to
# ctx.delegation. A profile's own patch layer can replace the row by id:
#
#   - insert:
#       - id: consult-delegation
#         name: '@aubwang/dsh-consult/toy-provider'
#         config:
#           delayMs: 50
#
# Only one provider may be mounted per context — ctx.delegation is a single
# service name, and loading a second implementation throws. drill/toy.patch.yml
# is a runnable version of the swap.
